[package]
name = "quartzfire-webui"
version = "0.1.0"
edition = "2021"
description = "QuartzFire WebUI backend: static server + VyOS HTTP API proxy"
license = "GPL-2.0-or-later"

[[bin]]
name = "quartzfire-webui"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
# LinesStream over journalctl's stdout for the Traffic Monitor SSE stream.
tokio-stream = { version = "0.1", features = ["io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
jsonwebtoken = "9"
# Verifies the sha512-crypt (`$6$…`) hashes VyOS stores under
# `system login user <u> authentication encrypted-password`.
pwhash = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
