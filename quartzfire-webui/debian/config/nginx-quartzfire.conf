# QuartzFire WebUI nginx site.
# Terminates TLS and proxies everything to the local axum backend, which serves
# static assets and reverse-proxies /api/* to the VyOS HTTP API.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # VyOS ships a self-signed cert here by default; replace with your own via
    # `set service https certificates ...` or point these at your PKI.
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE streams (Traffic Monitor, IPS alerts). Without `proxy_buffering off`
    # nginx holds sparse streams in its proxy buffer — a quiet stream (e.g. the
    # alerts feed with no alerts yet) never flushes, so the browser sits in
    # "Connecting…" forever. The read timeout must also outlive the stream's
    # 15s keep-alive pings, not nginx's 60s default.
    location /api/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
