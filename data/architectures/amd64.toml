# Packages added to images for x86 by default
packages = [
  "grub2",
  "grub-pc",
  "vyos-drivers-realtek-r8152",
  "vyos-linux-firmware",
  "vyos-intel-qat",
  "vyos-intel-ixgbe",
  "vyos-intel-ixgbevf",
  "vyos-ipt-netflow",
  "intel-microcode",
  "amd64-microcode"
]

[additional_repositories.salt]
  architecture = "amd64"
  url = "https://packages.broadcom.com/artifactory/saltproject-deb"
  distribution = "stable"

[additional_repositories.zabbix]
  url = "https://repo.zabbix.com/zabbix/6.0/debian"
  distribution = "bookworm"
