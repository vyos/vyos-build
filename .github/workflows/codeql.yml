name: "Perform CodeQL Analysis"

on:
  push:
    branches:
      - rolling
      - circinus
      - sagitta
    paths:
      - '**'
      - '!.github/**'
      - '!**/*.md'
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - rolling
      - circinus
      - sagitta
    paths:
      - '**'
      - '!.github/**'
      - '!**/*.md'
  schedule:
    - cron: '22 10 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analysis-call:
    uses: vyos/.github/.github/workflows/codeql-analysis.yml@production
    secrets: inherit
    with:
      languages: "['python']"
