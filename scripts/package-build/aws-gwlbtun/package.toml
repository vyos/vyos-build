[[packages]]
# Newest 'asw-gwlbtun' requires the specific boost version (1.83)
# https://github.com/aws-samples/aws-gateway-load-balancer-tunnel-handler/blob/c1fd48b7b05879b199ebf1beeeacf0442b3c4ad2/CMakeLists.txt#L7
name = "boost"
commit_id = "boost-1.83.0"
scm_url = "https://github.com/boostorg/boost"
apply_patches = false

build_cmd = """
git submodule update --init --recursive
./bootstrap.sh --prefix=$HOME/.local
./b2 -j$(nproc) install
"""


[[packages]]
name = "aws-gwlbtun"
commit_id = "c1fd48b"
scm_url = "https://github.com/aws-samples/aws-gateway-load-balancer-tunnel-handler"
apply_patches = false

## Build cmd start
build_cmd = '''\
mkdir -p debian
echo 'obj-*-linux-gnu/gwlbtun usr/sbin' > debian/install

# changelog
cat <<EOF > debian/changelog
aws-gwlbtun (1.0-1) unstable; urgency=low

  * Initial release

 -- Your Name <your.email@example.com>  Wed, 29 Aug 2024 09:00:00 +0000

EOF

# control
/bin/bash -c "cat <<EOF > debian/control
Source: aws-gwlbtun
Section: net
Priority: optional
Maintainer: VyOS Package Maintainers <maintainers@vyos.net>
Build-Depends: debhelper-compat (= 13)
Standards-Version: 4.5.1
Homepage: https://github.com/aws-samples/aws-gateway-load-balancer-tunnel-handler

Package: aws-gwlbtun
Architecture: any
Depends: \${shlibs:Depends}, \${misc:Depends}
Description: AWS Gateway Load Balancer Tunnel Handler
 This is a simple package that handles tunneling for the AWS Gateway Load Balancer.
EOF
"

# rules
cat <<EOF > debian/rules
#!/usr/bin/make -f

%: dh $@

build:
	dh build

binary:
	dh binary

clean:
	dh clean
EOF

chmod +x debian/rules

# Patches for aws-gwlbtun should applied here
for patch in ../patches/aws-gwlbtun/*.patch; do
    echo "I: build_cmd applying patch $patch..."
    git -c user.email=maintainers@vyos.net -c user.name=vyos am "$patch" || { echo "Failed to apply patch $patch"; exit 1; }
done

debuild -us -uc -b
'''
## Build cmd end

[dependencies]
packages = [
    "cmake"
]
