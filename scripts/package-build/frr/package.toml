[[packages]]
name = "libyang"
commit_id = "v3.13.6"
scm_url = "https://github.com/CESNET/libyang.git"
build_cmd = "pipx run apkg build -i && find pkg/pkgs -type f -name *.deb -exec mv -t .. {} + && sudo dpkg -i ../libyang*.deb"

[[packages]]
name = "libbpf"
commit_id = "debian/1.7.0-1_exp1"
scm_url = "https://salsa.debian.org/sudip/libbpf.git"

[[packages]]
name = "frr"
commit_id = "9d7b378b80fed" # stable/10.7 branch
scm_url = "https://github.com/FRRouting/frr.git"
# dpkg-buildpackage doesn't allow changing debian/rules from patches if source package is built
# so change it by sed call
# Last grep is to check that --enable-splithorizon was really added to cover future possible changes
pre_build_hook = "sudo dpkg -i ../*.deb && sed -i 's/\\(--enable-logfile-mask=0640 \\\\\\)/\\1\\n		--enable-splithorizon \\\\/' debian/rules && grep -- '--enable-splithorizon' debian/rules"
build_cmd = "dpkg-buildpackage -us -uc -tc -F --source-option=--tar-ignore=.git --source-option=--tar-ignore=.github --source-option=-i --source-option=--extend-diff-ignore='^\\.github(?:/.*)?$' -Ppkg.frr.rtrlib,pkg.frr.lua"

[dependencies]
packages = [
    "chrpath",
    "gawk",
    "install-info",
    "libcap-dev",
    "libc-ares-dev",
    "libjson-c-dev",
    "libnl-3-dev",
    "librtr-dev",
    "libpam-dev",
    "libpcre3-dev",
    "libprotobuf-c-dev",
    "libpython3-dev:native",
    "python3-sphinx:native",
    "libsnmp-dev",
    "protobuf-c-compiler",
    "python3-dev:native",
    "texinfo",
    "lua5.3",
    "doxygen",
    "bison",
    "liblua5.3-dev",
    "flex",
    "libelf-dev",
    "libbpf-dev",
    "clang",
    "bpftool",
]
